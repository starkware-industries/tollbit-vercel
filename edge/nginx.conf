map $http_user_agent $tollbit_bot {
    default                     0;
    "~*ChatGPT-User"            1;
    "~*OAI-SearchBot"           1;
    "~*GPTBot"                  1;
    "~*PerplexityBot"           1;
    "~*Perplexity-User"         1;
    "~*anthropic-ai"            1;
    "~*ClaudeBot"               1;
    "~*Claude-Web"              1;
    "~*Claude-User"             1;
    "~*Claude-SearchBot"        1;
    "~*CCBot"                   1;
    "~*cohere-ai"               1;
    "~*YouBot"                  1;
    "~*Diffbot"                 1;
    "~*meta-externalagent"      1;
    "~*Timpibot"                1;
    "~*Amazonbot"               1;
    "~*Bytespider"              1;
}

server {
    # ... your existing config ...

    if ($tollbit_bot) {
        return 302 https://tollbit.yourdomain.com$request_uri;
    }
}
